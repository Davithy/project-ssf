<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARRY SKIES PORTFOLIO</title>
    <meta name="description"
        content="">
    <meta name="keywords" content="">
    <script type="module" src="../../js/accHandling.js"></script>

    <!-- FAVICON -->
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="../../assets/favicon/site.webmanifest">

    <!-- FONTS -->
    <link href="https://fonts.cdnfonts.com/css/starlight-rune-personal-use" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=nunito@400,900&f[]=melodrama@500,700&display=swap" rel="stylesheet"> 
    <link href="https://fonts.cdnfonts.com/css/supernova-2" rel="stylesheet">
    
    <!-- FANCYBOX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.umd.js"></script>

    <!-- SUPABASE -->

    <!-- STYLESHEETS -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/accHandling.css">
</head>

<body data-auth-redirect="true">
<!-- = NAV BAR = -->
    <header class="navbar">
        <a class="logo" href="../../home">
            <label class="logo">
                <img class="logo-item main" alt="STARRY SKY">
                <div class="logo-sparkle"></div> 
                <p class="logo-item tag">FIGHTERS</p>
            </label>
        </a>
        <nav class="nav-menu">
            <div class = "nav-item"><a href="../../home/" class="main-nav">Home</a></div>
            <div class = "nav-item"><a href="../../about/" class="main-nav">About</a></div>
            <div class = "nav-item"><a href="../" class="main-nav">Artists</a></div>
        </nav>
<!-- = FOR SMALLER SCREENS = -->
        <section class="burger-menu">
            <input type="checkbox" id="nav-check" class="burger-check">
            <div class="burger-btn" aria-hidden="true">
                <label for="nav-check" class="burger-icon">
                <span class="burger-lines" aria-hidden="true"><i></i><i></i><i></i></span>
                </label>
            </div>
        </section>
    </header>

    <main>
        <section class="acc-signin">
            <div class="login panel">
                <span class="acc-segmnt acc-header">
                    <h2> Welcome Back! </h2>
                </span>
                <span class="acc-segmnt">
                    <p>E-mail</p>
                    <input class="acc-mail textbox" type="text" placeholder="E-mail" required>
                </span>
                <span class="acc-segmnt">
                    <p>Password</p>
                    <input class="acc-pass textbox submittable" type="password" placeholder="Password" required>
                    <label><a href="../forgot-password" class="pass-redirect">Forgot Password?</a></label>
                </span>
                <span class="acc-segmnt">
                    <button class="acc-btn acc-login submittable-target" type="button">
                        <label>
                            <h3>Log in</h3>
                        </label>
                    </button>
                </span>
                <span class="acc-segmnt regi-redirect">
                    <p>Don't have an account? <a href="../registration">Sign up!</a></p>
                </span>
            </div>
        </section>
    </main>

<!-- = FOOTER = -->
    <footer class="footer">
        <p>© 2026 by Aron Ferreras</p>
        <div class="socials">
        </div>
    </footer>
</body>
<noscript>Some functions are not fully available without Javascript, but enjoy the art!</noscript>
</html>
